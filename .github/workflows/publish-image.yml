name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npx eslint src --no-fix
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Deploy to Vultr
        timeout-minutes: 5
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          SOURCE: https://github.com/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}" "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${options[@]}" "$target" 'mkdir -p ~/portfolio-be'
          scp "${options[@]}" compose.yaml "$target:portfolio-be/"
          remote_command=$(cat <<EOF
          set -eu
          cd ~/portfolio-be
          test -f .env || { echo 'Create server .env with database settings first'; exit 1; }
          registry_config=\$(mktemp -d)
          trap 'rm -rf "\$registry_config"' EXIT
          printf 'API_IMAGE=%s\n' '$IMAGE' > "\$registry_config/deploy.env"
          sudo -n docker --config "\$registry_config" login ghcr.io -u '$GHCR_USER' --password-stdin
          sudo -n docker --config "\$registry_config" compose --env-file "\$registry_config/deploy.env" -p portfolio -f compose.yaml pull
          sudo -n docker --config "\$registry_config" compose --env-file "\$registry_config/deploy.env" -p portfolio -f compose.yaml up -d --wait --wait-timeout 90 db
          sudo -n docker --config "\$registry_config" compose --env-file "\$registry_config/deploy.env" -p portfolio -f compose.yaml run --rm --no-deps api npm run db:migrate
          sudo -n docker --config "\$registry_config" compose --env-file "\$registry_config/deploy.env" -p portfolio -f compose.yaml up -d --remove-orphans --wait --wait-timeout 90
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health
          sudo -n docker --config "\$registry_config" image prune -af --filter 'label=org.opencontainers.image.source=$SOURCE'
          EOF
          )
          printf '%s\n' "$GHCR_TOKEN" | ssh "${options[@]}" "$target" "$remote_command"
